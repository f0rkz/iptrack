name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: iptrack
          POSTGRES_PASSWORD: iptrack
          POSTGRES_DB: iptrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iptrack -d iptrack_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            terraform-provider-iptrack/go.sum

      - name: Test server and PostgreSQL persistence
        env:
          IPTRACK_TEST_DATABASE_URL: postgres://iptrack:iptrack@127.0.0.1:5432/iptrack_test?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...

      - name: Vet server
        run: go vet ./...

      - name: Test Terraform provider
        working-directory: terraform-provider-iptrack
        run: go test -race ./...

      - name: Vet Terraform provider
        working-directory: terraform-provider-iptrack
        run: go vet ./...

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: iptrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-config:
    name: Release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Validate release scripts
        run: |
          node --check release.config.cjs
          node --check scripts/write-release-output.mjs
          node --check scripts/resolve-release-version.mjs
          node -e 'require("./release.config.cjs")'

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
