services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iptrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iptrack}
      POSTGRES_DB: ${POSTGRES_DB:-iptrack}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  iptrack:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-iptrack}:${POSTGRES_PASSWORD:-iptrack}@db:5432/${POSTGRES_DB:-iptrack}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
